# Divan - Claude Code Super Collection
# ═══════════════════════════════════════════════════════════════════════════════
# The master manifest of all available components.
# Profiles select subsets by tags. The `divan` CLI reads this file.
#
# Every plugin/skill/hook/agent is tagged so profiles can compose them freely.
# Tags: core, git, code-quality, workflow, frontend, backend, ai-ml, platform,
#       code-intel, devtools, communication, lsp, session, safety, python, cpp

version: "2.0.0"
name: divan
description: "Curated Claude Code super collection"
author: Mahi97
marketplace: claude-plugins-official

# ─── Plugins ──────────────────────────────────────────────────────────────────
plugins:
  # ── Core (always included) ──
  - name: superpowers
    description: "Brainstorming, planning, TDD, debugging, parallel agents, code review"
    tags: [core, workflow]
    required: true

  - name: ralph-loop
    description: "Self-referential loop prevention"
    tags: [core, safety]
    required: true

  - name: context7
    description: "Live documentation lookup for any library/framework/SDK"
    tags: [core, code-intel]
    required: true

  - name: github
    description: "GitHub issues, PRs, repos, code search via Copilot MCP"
    tags: [core, git]
    required: true

  - name: commit-commands
    description: "Git commit, push, PR, and branch cleanup commands"
    tags: [core, git]
    required: true

  - name: remember
    description: "Persistent session state across conversations"
    tags: [core, session]
    required: true

  # ── Git & Code Quality ──
  - name: code-review
    description: "Pull request and code review workflows"
    tags: [git, code-quality]

  - name: code-simplifier
    description: "Code cleanup, reuse detection, efficiency improvements"
    tags: [code-quality]

  - name: qodo-skills
    description: "Coding rules, PR review feedback, code quality enforcement"
    tags: [code-quality]

  # ── Workflow & Automation ──
  - name: feature-dev
    description: "Guided feature development with architecture focus"
    tags: [workflow]

  - name: hookify
    description: "Create hooks to prevent unwanted behaviors"
    tags: [workflow, automation]

  # ── Frontend ──
  - name: frontend-design
    description: "Production-grade frontend interface generation"
    tags: [frontend]

  # ── Platforms & Backend ──
  - name: vercel
    description: "Vercel deployment, AI SDK, functions, storage, platform management"
    tags: [platform, frontend, backend, ai-ml]

  - name: supabase
    description: "Database, auth, storage, edge functions via Supabase MCP"
    tags: [platform, backend]

  - name: huggingface-skills
    description: "ML model training, datasets, Gradio apps, HF Hub operations"
    tags: [ai-ml, platform]

  # ── Code Intelligence ──
  - name: greptile
    description: "Semantic codebase search and analysis"
    tags: [code-intel]

  # ── Development Tools ──
  - name: plugin-dev
    description: "Plugin, skill, hook, agent, command development toolkit"
    tags: [devtools]

  - name: skill-creator
    description: "Create, modify, evaluate, and benchmark skills"
    tags: [devtools]

  - name: agent-sdk-dev
    description: "Claude Agent SDK app scaffolding and verification"
    tags: [devtools]

  - name: claude-code-setup
    description: "Automation recommendations for hooks, subagents, skills"
    tags: [devtools]

  - name: claude-md-management
    description: "Audit and improve CLAUDE.md files"
    tags: [devtools]

  # ── Communication ──
  - name: telegram
    description: "Telegram bot integration for chat-based interactions"
    tags: [communication]

  # ── Language Servers ──
  - name: clangd-lsp
    description: "C/C++ language server for code intelligence"
    tags: [lsp, cpp]

  - name: pyright-lsp
    description: "Python language server for type checking and intelligence"
    tags: [lsp, python]

# ─── MCP Servers ──────────────────────────────────────────────────────────────
mcp_servers:
  - name: github
    url: "https://api.githubcopilot.com/mcp/"
    auth: oauth
    plugin: github

  - name: vercel
    url: "https://mcp.vercel.com"
    auth: oauth
    plugin: vercel

  - name: supabase
    url: "https://mcp.supabase.com/mcp"
    auth: oauth
    plugin: supabase

  - name: huggingface
    url: "https://huggingface.co/mcp?login"
    auth: oauth
    plugin: huggingface-skills

  - name: greptile
    url: "https://api.greptile.com/mcp"
    auth: oauth
    plugin: greptile

  - name: context7
    embedded: true
    plugin: context7

# ─── Custom Components ────────────────────────────────────────────────────────
# Skills, hooks, agents, and commands defined in this repo.
# Each has tags so profiles can select them just like plugins.
custom:
  skills_dir: "skills/"
  hooks_dir: "hooks/"
  agents_dir: "agents/"
  commands_dir: "commands/"
