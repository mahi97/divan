# External Skills Manifest
#
# Lists skills to fetch from external sources.
# Run `python tools/fetch_skills.py` to install them.
#
# Format:
#   - name: skill-name
#     source: github | url | local
#     location: <URL or path>
#     dest: skills/external/<name>/
#     description: what it does

skills:

  # ─────────────────────────────────────────────────────────────────
  # Engineering workflow skills (addyosmani/agent-skills)
  # Full lifecycle: idea → spec → plan → build → test → ship
  # ─────────────────────────────────────────────────────────────────

  - name: idea-refine
    source: github
    location: https://github.com/addyosmani/agent-skills/tree/main/skills/idea-refine
    dest: skills/external/idea-refine/
    description: Clarify and sharpen a rough idea before starting work

