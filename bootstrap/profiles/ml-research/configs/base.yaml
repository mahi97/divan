# Base experiment configuration for {{PROJECT_NAME}}
# Override any value from the command line or a child config.

experiment:
  name: baseline
  seed: 42
  tags: []

paths:
  data_root: data/
  dataset_dir: data/datasets/
  results_root: results/
  checkpoint_dir: results/checkpoints/
  cache_root: .cache/
  hf_home: .cache/huggingface/
  hf_datasets_cache: .cache/huggingface/datasets/
  hf_hub_cache: .cache/huggingface/hub/
  transformers_cache: .cache/huggingface/transformers/

model:
  type: mlp  # Replace with your model type
  hidden_size: 256
  num_layers: 4
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 1.0e-4
  epochs: 100
  optimizer: adam
  scheduler: cosine
  weight_decay: 1.0e-4
  gradient_clip: 1.0

data:
  dataset: null     # Set to your dataset name
  data_dir: data/datasets/
  num_workers: 4

logging:
  backend: wandb    # wandb | tensorboard | none
  project: "{{PROJECT_NAME}}"
  log_interval: 10  # steps

checkpointing:
  save_dir: results/checkpoints/
  save_every: 10    # epochs
  keep_last: 3

compute:
  server: local     # local | bare-gpu | hpc
  accelerator: cuda  # cuda | cpu | mps
  gpu_devices: [0]   # Set to [] for CPU or scheduler-managed allocation
  gpu_count: 1
  gpu_type: null
